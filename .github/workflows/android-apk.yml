# Android APK — the DIRECT distribution channel (Phase Ω).
#
# Builds a REAL, signed, installable release APK of apps/mobile on
# GitHub's own runners — no EAS quota, no external account — and
# publishes it to the rolling «latest» GitHub Release, so ONE stable
# URL always serves the newest build:
#
#   https://github.com/ahmadmedo1012/ulara/releases/latest/download/ulara.apk
#
# (the repo rename lands at integration; GitHub redirects the old
# org/repo path, so both spellings resolve during the transition)
#
# The build itself is the repo's ONE build recipe — scripts/build-
# android-local.sh (docs/mobile/ANDROID-LOCAL.md): expo prebuild →
# key.properties + release signingConfig patch → gradlew assembleRelease.
# CI just drives it with the repository-secret keystore.
#
# Signing: a dedicated DIRECT-CHANNEL keystore (Android repository
# secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). It is deliberately
# SEPARATE from any future Play upload key (that one stays in EAS
# credentials — RELEASE.md §store-prep). A stable signature means a
# new APK installs as an UPDATE over previous direct installs.
#
# Triggers:
#   push → main, when the app or its inputs change (JS changes ship a
#          new APK too — the bundle is embedded in the binary)
#   workflow_dispatch → manual rebuild (quota reset, recipe change…)
name: Android APK (direct)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'shared/**'
      - 'scripts/build-android-local.sh'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never two APK pipelines at once — the second replaces the rolling
# release only after it has a complete artifact (queued, not cancelled).
concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build-and-publish:
    name: Build · sign · publish (rolling latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK components (platform 37 · build-tools 37 · NDK 27.1)
        # Expo SDK 58 / RN 0.88 exact requirements — the same pins the
        # local build script checks for (scripts/build-android-local.sh §0c).
        run: |
          # ubuntu-24.04 images don't always put cmdline-tools on PATH —
          # resolve the binary from ANDROID_HOME, falling back to PATH.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # The 2026 repository serves MINOR-VERSIONED platform packages —
          # compileSdk 37's platform is 'platforms;android-37.0' (plain
          # android-37 does not exist in the index; verified against
          # repository2-3.xml). AGP/legacy paths that ask for the
          # android-37 DIRECTORY are covered by the symlink below.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          [ -d "$ANDROID_HOME/platforms/android-37" ] || \
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Gradle + NDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: android-apk-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            android-apk-

      - name: Dependencies (npm ci)
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Release keystore (repository secrets — the direct-channel key)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret missing — the direct channel cannot sign without it (RELEASE.md §direct channel documents the key model)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ulara-direct.jks"
          chmod 600 "$RUNNER_TEMP/ulara-direct.jks"
          echo "keystore materialized at $RUNNER_TEMP/ulara-direct.jks"

      - name: Build the signed release APK (the repo's own recipe)
        env:
          ULARA_ANDROID_KEYSTORE: ${{ runner.temp }}/ulara-direct.jks
          ULARA_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ULARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ULARA_ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_NO_TELEMETRY: '1'
          CI: 'true'
        run: scripts/build-android-local.sh

      - name: Verify the artifact + signature
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::release APK not found at $APK"
            exit 1
          fi
          cp "$APK" ulara.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs ulara.apk
          sha256sum ulara.apk | tee apk.sha256

      - name: Release metadata (app version from the resolved Expo config)
        id: meta
        working-directory: apps/mobile
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          VERSION=$(node -p "require('$RUNNER_TEMP/expo-config.json').version || '0.0.0'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app version: $VERSION"

      - name: Publish the rolling «latest» release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SHA=$(cut -d' ' -f1 apk.sha256)
          SIZE=$(du -h ulara.apk | cut -f1)
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          # أُلارا — تطبيق أندرويد (قناة التنزيل المباشر)

          بناء مباشر من أحدث شيفرة الفرع الرئيسي — يُنتج تلقائيًا عبر GitHub Actions
          كلما تغيّر التطبيق، ويحلّ محلّ السابق في نفس الرابط.

          | | |
          |---|---|
          | الإصدار | \`v${VERSION}\` |
          | الالتزام | \`${GITHUB_SHA}\` |
          | حجم الملف | ${SIZE} |
          | SHA-256 | \`${SHA}\` |

          **التثبيت:** نزّل \`ulara.apk\` وافتحه على جهازك، واسمح بـ«التثبيت من
          مصادر غير معروفة» عند سؤال النظام أول مرة. التوقيع ثابت عبر البناءات —
          التحديثات تُثبَّت فوق النسخ السابقة مباشرة دون إزالة.

          **ملاحظات:**
          - هذه قناة التوزيع المباشر؛ نسخة متجر Google Play (AAB) قيد الإعداد
            وتتخطّى خطوة واحدة من المالك (RELEASE.md).
          - التحديثات التلقائية (OTA) عبر EAS لم تُفعَّل بعد (يتطلب تهيئة مشروع
            EAS الجديد — RELEASE.md).
          - حزمة الويب (PWA) بديل فوري للمتصفح: ulara.vercel.app.
          EOF
          # The rolling release: delete + recreate the fixed `latest` tag so
          # BOTH stable URLs always resolve to the newest build:
          #   /releases/latest/download/ulara.apk  (latest full release)
          #   /releases/download/latest/ulara.apk  (fixed tag)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest ulara.apk#ulara.apk \
            --title "أُلارا — أندرويد v${VERSION} (أحدث بناء)" \
            --notes-file "$NOTES" \
            --latest

      - name: Job summary
        run: |
          {
            echo "## Android APK — rolling «latest» release published"
            echo ""
            echo "- Stable download: https://github.com/ahmadmedo1012/ulara/releases/latest/download/ulara.apk"
            echo "- Fixed-tag download: https://github.com/ahmadmedo1012/ulara/releases/download/latest/ulara.apk"
            echo "- Releases page: https://github.com/ahmadmedo1012/ulara/releases"
            echo "- App version: ${{ steps.meta.outputs.version }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
