# ═══════════════════════════════════════════════════════════════════════════
# mobile-capture-r366 — THE FIDELITY LOOP capture rig (r366, P0).
#
# The two §3 rigs of the work order, as ONE dispatchable workflow:
#
#   · build-apk — the release APK built ONCE (the repo's one recipe,
#     scripts/build-android-local.sh, throwaway keystore, embedded-API
#     base URL 10.0.2.2:4000 baked at bundle time), uploaded as an
#     artifact so the device matrix never re-pays the Gradle toll.
#   · android-capture — a KVM emulator matrix (small phone via wm-size,
#     pixel_5, pixel_6_pro, pixel_tablet), each leg
#     boots its own seeded backend (tools/boot-pg.sh + migrate + seed +
#     :4000, ULARA_TEST_ACCOUNTS=1) and drives the REAL APK with Maestro
#     + adb deep links: PUBLIC (logged out) → onboarding tour → per-role
#     login journeys → role route sweeps × light/dark × font 1.0/2.0 ×
#     portrait/landscape → a scroll recording → logcat + cold/warm start
#     timings. Artifacts: android-capture-<device>.
#   · ios-capture — macos-26: Debug SIMULATOR build (unsigned), iPhone
#     SE-class + Pro Max-class + iPad, public sweeps + dark + accessibility
#     large-text + a best-effort student journey against the live API.
#     Artifacts: ios-sim-capture.
#
# Dispatch: gh workflow run mobile-capture-r366.yml --ref <branch>
# (inputs.matrix_set quick | full). Evidence sheets + critiques land in
# docs/redesign/r366/evidence/ in the working branch afterwards.
#
# Everything here is CAPTURE-ONLY: no lane contracts move, no release
# channels touched — android-apk.yml / build-ios-sidestore.yml / mobile.yml
# keep their exact behaviour.
# ═══════════════════════════════════════════════════════════════════════════
name: mobile-capture-r366

on:
  workflow_dispatch:
    inputs:
      matrix_set:
        description: 'quick (pixel_5 + pixel_tablet) | full (+ pixel_6_pro)'
        default: 'quick'
        type: choice
        options:
          - quick
          - full
  # workflow_dispatch needs the file on the DEFAULT branch to be
  # dispatchable from a branch ref — on this working branch the rig rides
  # scoped pushes instead (any touch of the rig itself or the capture
  # scripts re-runs it; matrix_set falls back to quick).
  push:
    branches:
      - r366/app-world-class
    paths:
      - '.github/workflows/mobile-capture-r366.yml'
      - 'apps/mobile/scripts/capture/**'

permissions:
  contents: read

concurrency:
  group: mobile-capture-r366-${{ inputs.matrix_set || 'push' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'

jobs:
  # ── plan: the device matrix per set ──────────────────────────────────
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devices: ${{ steps.plan.outputs.devices }}
    steps:
      - id: plan
        run: |
          if [ "${{ inputs.matrix_set || 'quick' }}" = "full" ]; then
            # r367: pixel_fold retires from the full matrix — the 2026 runner
            # image's avdmanager dropped the device definition (run
            # 45903140875's leg: 'No device found matching --device
            # pixel_fold', the emulator never booted; the same class as
            # the r367 nexus retire). Three devices remain — phone, XL
            # phone, tablet — the foldable's two-pane work is P5's own
            # session anyway.
            echo 'devices=[{"device":"pixel_5","set":"phone"},{"device":"pixel_6_pro","set":"phone-xl"},{"device":"pixel_tablet","set":"tablet"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'devices=[{"device":"pixel_5","set":"phone"},{"device":"pixel_tablet","set":"tablet"}]' >> "$GITHUB_OUTPUT"
          fi

  # ── the release APK, built once (throwaway keystore, 10.0.2.2 base) ──
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK components (platform 37 · build-tools 37 · NDK 27.1)
        # byte-mirror of the android-apk.yml / mobile.yml lane D step —
        # the repo's ONE build recipe pins (Expo SDK 58 / RN 0.88)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          [ -d "$ANDROID_HOME/platforms/android-37" ] || \
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Gradle + NDK cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: android-capture-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            android-smoke-
            android-apk-

      - name: Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Build the release APK (throwaway keystore · 10.0.2.2 base URL)
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000/api/v1
          ULARA_ANDROID_KEYSTORE: ${{ runner.temp }}/capture.jks
          ULARA_ANDROID_KEYSTORE_ALIAS: capture
          ULARA_ANDROID_KEYSTORE_PASSWORD: capture-keystore-pass
          ULARA_ANDROID_KEYSTORE_KEY_PASSWORD: capture-keystore-pass
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/capture.jks" \
            -alias capture -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass capture-keystore-pass -keypass capture-keystore-pass \
            -dname "CN=Ulara Capture, OU=CI, O=Ulara, L=Tripoli, ST=Tripoli, C=LY"
          scripts/build-android-local.sh
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::release APK not found at $APK"; exit 1; }
          du -h "$APK"

      - name: Upload the capture APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ulara-capture-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

  # ── android-capture: the device matrix, each leg with its own backend ─
  android-capture:
    name: Android capture (${{ matrix.device }})
    needs: [plan, build-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
    env:
      DATABASE_URL: postgresql://ulara@localhost:5433/ulara
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download the capture APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ulara-capture-apk
          path: apps/mobile/android/app/build/outputs/apk/release

      # ── the seeded backend (same stack as mobile.yml lane D) ──────────
      - name: Boot embedded PostgreSQL (tools/boot-pg.sh, :5433)
        run: |
          cd tools
          npm install --no-audit --no-fund
          bash boot-pg.sh

      - name: Create the ulara database
        run: |
          cd tools
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ host: "127.0.0.1", port: 5433, user: "ulara", database: "postgres" });
              await c.connect();
              const r = await c.query("SELECT 1 FROM pg_database WHERE datname = $1", ["ulara"]);
              if (r.rows.length === 0) await c.query("CREATE DATABASE ulara");
              await c.end();
              console.log("db ulara ready");
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '

      - name: Root workspace install (backend + frontend)
        run: npm ci --no-audit --no-fund

      - name: Migrate + seed (db:deploy + db:seed)
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Boot backend (:4000, test accounts on) + wait for /api/v1/status
        run: |
          export JWT_ACCESS_SECRET="$(openssl rand -hex 48)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 48)"
          export ULARA_TEST_ACCOUNTS=1
          export PORT=4000
          nohup npm run dev -w backend > backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4000/api/v1/status >/dev/null 2>&1; then
              echo "backend up (poll $i)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::backend never answered /api/v1/status within 120s"
          tail -40 backend.log
          exit 1

      # ── emulator + the capture script ────────────────────────────────
      - name: Unblock KVM for the emulator (ubuntu-24.04 image quirk)
        run: sudo chmod 666 /dev/kvm || true

      - name: Install Maestro CLI (before the emulator — fail fast, ~15s)
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Emulator + the r366 capture sweep
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -memory 4096 -cores 2
          emulator-boot-timeout: 720
          script: bash apps/mobile/scripts/capture/capture-device.sh ${{ matrix.device.device }} ${{ matrix.device.set }}

      - name: Crash gate (logcat forensics — fails the job on signatures)
        if: always()
        run: |
          shopt -s nullglob
          LOGS=(shots/*/logcat-*.txt)
          if [ ${#LOGS[@]} -eq 0 ]; then
            echo "::error::no logcat captured — did the emulator boot?"
            exit 1
          fi
          cat "${LOGS[@]}" > logcat-combined.txt
          # r367: the signature scan rides OUR process only — run
          # 45824603832's forensics showed the FATAL EXCEPTION was the
          # SYSTEM launcher's (com.google.android.apps.nexuslauncher,
          # its own index bug at boot); a system process crash cannot
          # fail our leg. The gate keeps the full forensics in the
          # artifact either way, and fails ONLY when a crash block's
          # own `Process:` line names our app.
          OUR_CRASHES=$(awk -v RS='FATAL EXCEPTION' '/Process: ly\.ulara\.app/ {print NR}' logcat-combined.txt | wc -l)
          OUR_JS_CRASHES=$(grep -c 'ReactNativeJS.*Error' logcat-combined.txt || true)
          grep -nE -B2 -A15 'FATAL EXCEPTION|ReactNativeJS.*Error|SIGABRT|Invariant Violation' logcat-combined.txt > crash-report.txt || true
          if [ "${OUR_CRASHES:-0}" -gt 0 ] || [ "${OUR_JS_CRASHES:-0}" -gt 0 ]; then
            cat crash-report.txt
            echo "::error::logcat crash signatures from ly.ulara.app on ${{ matrix.device.device }} — full context in the artifact"
            exit 1
          fi
          echo "clean — no crash signatures from ly.ulara.app (system-process signatures recorded in the forensics, non-gating) (${{ matrix.device.device }})" > crash-report.txt
          echo "clean — no crash signatures (${{ matrix.device.device }})" > crash-report.txt

      - name: Upload capture evidence (${{ matrix.device.device }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-capture-${{ matrix.device.device }}
          path: |
            shots/
            backend.log
            crash-report.txt
          retention-days: 14
          if-no-files-found: warn

  # ── ios-capture: the simulator rig on macos-26 ───────────────────────
  ios-capture:
    name: iOS simulator capture
    runs-on: macos-26
    timeout-minutes: 100
    env:
      COCOAPODS_DISABLE_STATS: 'true'
      EXPO_PUBLIC_API_BASE_URL: https://ulara.vercel.app/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Prebuild the iOS simulator workspace
        working-directory: apps/mobile
        run: |
          rm -rf ios
          npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: apps/mobile
        run: pod install --project-directory=ios

      - name: Build for the simulator (Debug, unsigned)
        working-directory: apps/mobile
        run: |
          # expo prebuild names the workspace/scheme after the sanitized
          # app name — detect both from the workspace file itself
          # (`ls ios/*.xcodeproj` lists INSIDE the dir — run 45733427792's
          # forensics: the build asked for 'ios/project.pbxproj.xcworkspace').
          WS="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WS" .xcworkspace)"
          echo "workspace: $WS | scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Install Maestro CLI
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: The iOS capture sweep (SE-class · Pro Max-class · iPad)
        working-directory: apps/mobile
        run: bash scripts/capture/capture-ios.sh

      - name: Upload iOS capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-sim-capture
          path: apps/mobile/shots/
          retention-days: 14
          if-no-files-found: warn
