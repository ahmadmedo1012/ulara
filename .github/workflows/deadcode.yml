name: deadcode

# T-22 Track B: dead-code / duplication / circular-dep ratchet gate.
# r341/Y5: GitHub Actions quota was restored — Actions is ALIVE again
# (verified 2026-11-07; this workflow ran green on main same day). The old
# "CI is currently quota-dead" note is obsolete.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege — analysis only; this workflow never needs write scopes
# (the same posture as ci.yml / size-gate.yml).
permissions:
  contents: read

# Same per-ref policy as CI: a rapid push series to one branch cancels
# the superseded analysis runs instead of burning Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deadcode-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install repo deps (analyzers resolve against the real tree)
        run: npm ci --ignore-scripts
      - name: Install pinned analyzers
        run: npm install -g knip@5.88.1 jscpd@5.4.2 dependency-cruiser@18.7.2 typescript@5.7.2
      - name: Dead-code ratchet (knip + jscpd + dependency-cruiser vs baseline)
        run: bash scripts/deadcode/check.sh
