# R327 D2 (EAS Build retired): the OTA ledger — records what the EAS
# OTA (JS update) channel actually delivered.
#
# Manual-only (never triggers builds): native builds are GitHub-Actions-
# only in this repo (mobile.yml's devclient/full lanes, android-apk.yml's
# QA + signed rolling-latest release APK, build-ios-sidestore.yml's
# sidestore IPA) — `eas build` is retired, so this ledger no longer
# records EAS native builds. EAS remains ONLY as the OTA (JS update)
# channel, and this ledger records that channel's history: dispatched
# any time, it asks EAS for the update branches and prints the updates
# (ids, runtimeVersions, messages, timestamps) to the job log — the
# durable record for the ops ledger and the /app page. A checkout happens
# only so the EAS CLI can resolve the project context (app.config.ts
# lives there); no builds, no writes: a pure read.
#
#   gh workflow run mobile-builds-ledger.yml
#   # or: POST /repos/…/actions/workflows/mobile-builds-ledger.yml/dispatches
name: Mobile OTA ledger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-builds-ledger
  cancel-in-progress: false

jobs:
  ledger:
    name: eas update:list (the OTA channel)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        # the EAS CLI needs the project context (app.config.ts lives here)
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # R327 D4: the OTA ledger — the update branches with
      # their runtimeVersions, so a build's runtimeVersion can be matched
      # against the updates that build will fetch (the fingerprint policy).
      - name: List update branches (channel · runtimeVersion · updates)
        run: |
          set -o pipefail
          for BRANCH in production preview; do
            echo "── branch: $BRANCH"
            npx eas-cli@latest update:list --branch "$BRANCH" --limit 6 --json --non-interactive 2>&1 | tee "updates-$BRANCH.json" | tail -5
          done
          {
            echo "## EAS Update branches"
            for BRANCH in production preview; do
              echo "### $BRANCH"
              echo '| update id | runtimeVersion | message | createdAt |'
              echo '|---|---|---|---|'
              node -e '
                const fs = require("fs");
                const raw = fs.readFileSync(process.argv[1], "utf8");
                const start = raw.indexOf("["); const end = raw.lastIndexOf("]");
                if (start === -1 || end === -1) { console.log("| — | — | (no json parsed) | — |"); process.exit(0); }
                const rows = JSON.parse(raw.slice(start, end + 1));
                const flat = Array.isArray(rows) ? rows : (rows.updates ?? rows.channels ?? []);
                for (const u of (flat.length ? flat : [rows])) {
                  console.log(`| ${u.id ?? u.updateId ?? "—"} | ${u.runtimeVersion ?? u.runtimeVersionId ?? "—"} | ${String(u.message ?? "—").slice(0, 60)} | ${u.createdAt ?? "—"} |`);
                }
              ' "updates-$BRANCH.json" || echo "| — | — | parse failed | — |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
