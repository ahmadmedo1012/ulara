<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أُلارا — لا يوجد اتصال</title>
  <link rel="icon" href="/brand/icon-192.png" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #F2F1EC; color: #282828;
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    }
    .sheet { text-align: center; padding: 40px 24px; max-width: 420px; }
    .mark { font-size: 40px; line-height: 1; letter-spacing: 0.06em; font-weight: 700; }
    .mark b { color: #2540D9; font-weight: 700; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 18px 0 8px; }
    p { font-size: 0.9rem; line-height: 1.8; color: #646464; margin: 0 0 22px; }
    a {
      display: inline-grid; min-height: 44px; box-sizing: border-box; place-items: center; text-decoration: none;
      font: inherit; font-weight: 600; font-size: 0.875rem;
      padding: 10px 22px; border: 1px solid #282828; background: #282828;
      color: #F2F1EC; cursor: pointer; border-radius: 0;
    }
    a:hover { background: #2540D9; border-color: #2540D9; }
    @media (prefers-color-scheme: dark) {
      body { background: #262019; color: #F0F0EB; }
      p { color: #B4B4B0; }
      .mark b { color: #8AA0FF; }
      a { color: #262019; background: #8AA0FF; border-color: #8AA0FF; }
      a:hover { background: #F0F0EB; border-color: #F0F0EB; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="mark" aria-hidden="true">أُلارا<b>.</b></div>
    <h1>لا يوجد اتصال</h1>
    <p>انقطعت الشبكة بينك وبين المنصّة. الصفحات التي زرتها للتوّ قد تعمل
       من الذاكرة المؤقتة — أما الجديد فيحتاج اتصالًا. أعد المحاولة بعد
       استعادة الشبكة.</p>
    <a href="">أعد المحاولة</a>
  </main>
</body>
</html>
