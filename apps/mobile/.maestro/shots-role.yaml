# ═══════════════════════════════════════════════════════════════════════════
# shots-role.yaml — r359 A4 (C8): one role's HOME screen captured at the
# CURRENT viewport size (the android-smoke script drives this at the
# pixel_6 profile, then at 320×568 and 768×1024 via `adb shell wm size`
# for the all-sizes evidence). Runs AFTER the five-role journey (the
# logins are warm; the tour is already completed or skipped by the
# optional تخطي in smoke-role.yaml).
# ENV: EMAIL, PASSWORD, ROLE (dashboard heading per role, same mapping
#      as smoke-role.yaml), SHOT (the screenshot name suffix).
# ═══════════════════════════════════════════════════════════════════════════
name: shots-role (r359 C8 — a role home, captured)
appId: ly.ulara.app
---
- launchApp:
    appId: ly.ulara.app
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- scrollUntilVisible:
    element:
      text: "ابدأ الآن"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "ابدأ الآن"
- extendedWaitUntil:
    visible:
      text: "تسجيل الدخول"
    timeout: 20000
- tapOn:
    id: "login-email"
- inputText: "${EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${PASSWORD}"
# r367: the capture rig's cold legs lost the submit tap (run
# 45835244276: «دخول» not found for EVERY role — the fresh boot's IME
# never rose after the password input, so the KeyboardStickyView bar
# never offset in and the inline resting button sat below the demo
# ladder's fold). The tap now rides the smoke flow's proven sequence
# PLUS the settled-form fallback: dismiss the IME (no-op when it never
# opened), scroll the resting submit into view (exact-word regex — the
# smoke flow's own anti-collision spelling so the taps can never land
# on the «تسجيل الدخول» heading), tap it. Every fallback is optional:
# when the sticky bar DID mount, the first tap already fired and the
# rest are settled no-ops.
- tapOn:
    text: "دخول"
- tapOn:
    text: "دخول"
    optional: true
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      textMatches: "^دخول$"
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    textMatches: "^دخول$"
    optional: true
- tapOn:
    text: "تخطي"                   # the tour escape, when still owed
    optional: true
# r359 A4: the student's two memberships → /select-institution. Pick the
# primary workspace (optional for single-membership roles).
- tapOn:
    text: "مساحة عمل أُلارا التجريبية"
    optional: true
- extendedWaitUntil:
    visible:
      text: "${ROLE == 'STUDENT' ? 'أرقامك هذا الفصل' : ROLE == 'TEACHER' ? 'لوحة الأستاذ' : ROLE == 'ADMIN' ? 'لوحة إدارة المؤسسة' : ROLE == 'QUALITY' ? 'لوحة الجودة' : 'لوحة التحكم'}"
    timeout: 45000
- takeScreenshot: "HOME-${SHOT}"
